<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ola 🌻</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #17152d;
}

/* =========================
   ESCENARIO
========================= */

.scene {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #15132b 0%,
            #211b3d 30%,
            #493252 55%,
            #c66f68 78%,
            #f1a36d 100%
        );
}

/* brillo del horizonte */

.horizon-glow {
    position: absolute;
    width: 100%;
    height: 35%;
    bottom: 8%;
    left: 0;

    background: radial-gradient(
        ellipse at center,
        rgba(255,190,112,.45),
        transparent 70%
    );

    filter: blur(15px);
}

/* =========================
   ESTRELLAS
========================= */

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff9df;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255,255,220,.9);

    animation: twinkle 2.5s infinite ease-in-out;
}

.s1 { top: 13%; left: 13%; animation-delay: .3s; }
.s2 { top: 20%; left: 29%; animation-delay: 1.2s; }
.s3 { top: 10%; left: 72%; animation-delay: .8s; }
.s4 { top: 28%; left: 86%; animation-delay: 1.8s; }
.s5 { top: 33%; left: 8%; animation-delay: .5s; }
.s6 { top: 17%; left: 53%; animation-delay: 1.5s; }
.s7 { top: 37%; left: 67%; animation-delay: .2s; }

@keyframes twinkle {
    0%,100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* =========================
   LUNA
========================= */

.moon {
    position: absolute;

    width: 135px;
    height: 135px;

    top: 8%;
    right: 9%;

    border-radius: 50%;

    background: #fff5c7;

    box-shadow:
        0 0 20px rgba(255,244,190,.45),
        0 0 60px rgba(255,224,155,.25);
}

.moon::before {
    content: "";
    position: absolute;

    width: 18px;
    height: 18px;

    top: 35px;
    left: 30px;

    border-radius: 50%;

    background: rgba(220,196,140,.12);
}

.moon::after {
    content: "";
    position: absolute;

    width: 10px;
    height: 10px;

    bottom: 30px;
    right: 28px;

    border-radius: 50%;

    background: rgba(220,196,140,.13);
}

/* =========================
   MENSAJE
========================= */

.message {
    position: absolute;

    top: 11%;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    width: 10%;

    text-align: center;

    color: #fff5c9;

    animation: appear 1.5s ease forwards;
}

.message h1 {
    font-size: clamp(65px, 18vw, 105px);

    font-weight: 500;

    letter-spacing: 3px;

    text-shadow:
        0 3px 15px rgba(0,0,0,.2),
        0 0 30px rgba(255,226,145,.12);
}

.message .sunflower-icon {
    display: block;

    margin-top: 5px;

    font-family: sans-serif;

    font-size: 38px;

    animation: floating 3s ease-in-out infinite;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translate(-50%, -20px);
    }

    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

/* =========================
   CAMPO
========================= */

.ground {
    position: absolute;

    bottom: -15%;

    left: -10%;

    width: 120%;
    height: 32%;

    background: #102b20;

    border-radius: 50% 50% 0 0;

    z-index: 6;
}

/* =========================
   FLORES
========================= */

.flower {
    position: absolute;

    z-index: 5;

    transform-origin: bottom center;

    animation: sway 5s ease-in-out infinite;
}

.flower.big {
    width: 210px;
    height: 430px;

    left: 50%;
    bottom: 5%;

    transform: translateX(-50%);
}

.flower.small-left {
    width: 145px;
    height: 320px;

    left: -5%;
    bottom: 5%;

    transform: scale(.8);

    animation-delay: -1s;
}

.flower.small-right {
    width: 150px;
    height: 330px;

    right: -4%;
    bottom: 4%;

    transform: scale(.82);

    animation-delay: -2s;
}

@keyframes sway {
    0%,100% {
        rotate: -2deg;
    }

    50% {
        rotate: 2deg;
    }
}

/* TALLO */

.stem {
    position: absolute;

    bottom: 0;
    left: 50%;

    width: 11px;
    height: 72%;

    transform: translateX(-50%);

    background: linear-gradient(
        to right,
        #12672d,
        #2f9b43,
        #155d2b
    );

    border-radius: 10px;
}

/* HOJAS */

.leaf {
    position: absolute;

    width: 85px;
    height: 38px;

    background: linear-gradient(
        135deg,
        #258c3e,
        #0d5728
    );

    border-radius: 100% 0 100% 0;
}

.leaf.left {
    left: 5%;
    bottom: 37%;

    rotate: -25deg;
}

.leaf.right {
    right: 2%;
    bottom: 47%;

    rotate: 25deg;

    transform: scaleX(-1);
}

/* CABEZA DE LA FLOR */

.head {
    position: absolute;

    width: 155px;
    height: 155px;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    z-index: 3;
}

/* pétalos */

.petal {
    position: absolute;

    width: 62px;
    height: 90px;

    left: 47px;
    top: 33px;

    border-radius: 55% 55% 48% 48%;

    background: linear-gradient(
        145deg,
        #ffe947,
        #ffc400
    );

    transform-origin: 31px 45px;

    box-shadow:
        inset -4px -5px 8px rgba(180,110,0,.15),
        0 2px 8px rgba(80,50,0,.1);
}

.p1 { transform: rotate(0deg) translateY(-37px); }
.p2 { transform: rotate(45deg) translateY(-37px); }
.p3 { transform: rotate(90deg) translateY(-37px); }
.p4 { transform: rotate(135deg) translateY(-37px); }
.p5 { transform: rotate(180deg) translateY(-37px); }
.p6 { transform: rotate(225deg) translateY(-37px); }
.p7 { transform: rotate(270deg) translateY(-37px); }
.p8 { transform: rotate(315deg) translateY(-37px); }

/* centro */

.center {
    position: absolute;

    width: 65px;
    height: 65px;

    left: 45px;
    top: 45px;

    z-index: 10;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #b66b12,
            #713500 65%,
            #4a2100
        );

    box-shadow:
        inset 0 5px 8px rgba(255,180,50,.2),
        0 4px 8px rgba(0,0,0,.2);
}

/* =========================
   PÉTALOS FLOTANDO
========================= */

.floating-petal {
    position: absolute;

    z-index: 8;

    width: 13px;
    height: 7px;

    border-radius: 100% 0 100% 0;

    background: #f5bd32;

    animation: fall linear infinite;
}

.fp1 {
    left: 12%;
    top: -10%;
    animation-duration: 8s;
}

.fp2 {
    left: 78%;
    top: -15%;
    animation-duration: 10s;
    animation-delay: 2s;
}

.fp3 {
    left: 55%;
    top: -5%;
    animation-duration: 9s;
    animation-delay: 4s;
}

.fp4 {
    left: 90%;
    top: 15%;
    animation-duration: 11s;
    animation-delay: 1s;
}

@keyframes fall {
    0% {
        transform:
            translateY(-40px)
            translateX(0)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: .9;
    }

    50% {
        transform:
            translateY(45vh)
            translateX(-35px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(105vh)
            translateX(45px)
            rotate(360deg);

        opacity: 0;
    }
}

/* =========================
   AJUSTE CELULAR
========================= */

@media (max-width: 600px) {

    .moon {
        width: 115px;
        height: 115px;

        top: 9%;
        right: 7%;
    }

    .message {
        top: 13%;
    }

    .message h1 {
        font-size: 70px;
    }

    .message .sunflower-icon {
        font-size: 32px;
    }

    .flower.big {
        bottom: 4%;
        transform: translateX(-50%) scale(.82);
    }

    .flower.small-left {
        left: -28px;
        bottom: 5%;
        transform: scale(.65);
    }

    .flower.small-right {
        right: -30px;
        bottom: 4%;
        transform: scale(.67);
    }

    .ground {
        bottom: -12%;
        height: 28%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="horizon-glow"></div>

    <!-- ESTRELLAS -->
    <div class="stars">
        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>
        <span class="star s4"></span>
        <span class="star s5"></span>
        <span class="star s6"></span>
        <span class="star s7"></span>
    </div>

    <!-- LUNA -->
    <div class="moon"></div>

    <!-- MENSAJE -->
    <div class="message">
        <h1></h1>
        <span class="sunflower-icon"></span>
    </div>

    <!-- PÉTALOS -->
    <span class="floating-petal fp1"></span>
    <span class="floating-petal fp2"></span>
    <span class="floating-petal fp3"></span>
    <span class="floating-petal fp4"></span>

    <!-- FLOR IZQUIERDA -->
    <div class="flower small-left">

        <div class="stem"></div>

        <div class="leaf left"></div>

        <div class="head">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="center"></div>
        </div>

    </div>

    <!-- FLOR CENTRAL -->
    <div class="flower big">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="head">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="center"></div>

        </div>

    </div>

    <!-- FLOR DERECHA -->
    <div class="flower small-right">

        <div class="stem"></div>

        <div class="leaf right"></div>

        <div class="head">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="center"></div>

        </div>

    </div>

    <!-- TIERRA -->
    <div class="ground"></div>

</div>

</body>
</html>
