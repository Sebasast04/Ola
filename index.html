<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ola 🌻</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                #18152f 0%,
                #252044 45%,
                #e98b6d 100%
            );
            font-family: Georgia, serif;
        }

        .contenedor {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Luna */
        .luna {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #fff5bd;
            top: 95px;
            right: 55px;
            box-shadow: 0 0 35px rgba(255, 245, 189, 0.35);
        }

        /* Estrellas */
        .estrella {
            position: absolute;
            color: white;
            font-size: 20px;
            animation: parpadear 2s infinite alternate;
        }

        .e1 {
            top: 170px;
            left: 15%;
        }

        .e2 {
            top: 330px;
            right: 15%;
        }

        .e3 {
            top: 245px;
            left: 30%;
        }

        @keyframes parpadear {
            from {
                opacity: 0.3;
            }
            to {
                opacity: 1;
            }
        }

        /* Texto */
        .texto {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #fff4c5;
            z-index: 10;
        }

        .texto h1 {
            font-size: 58px;
            line-height: 0.95;
            margin-bottom: 20px;
        }

        .texto .flor {
            font-size: 42px;
            margin-bottom: 15px;
        }

        /* Flores */
        .flores {
            position: absolute;
            bottom: 115px;
            width: 100%;
            height: 430px;
        }

        .flor-grande {
            position: absolute;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
            width: 210px;
            height: 210px;
            animation: balanceo 4s ease-in-out infinite;
        }

        .flor-izquierda {
            position: absolute;
            left: 2%;
            top: 190px;
            transform: scale(0.72);
        }

        .flor-derecha {
            position: absolute;
            right: 0%;
            top: 175px;
            transform: scale(0.75);
        }

        .petalo {
            position: absolute;
            width: 90px;
            height: 130px;
            background: #ffd51f;
            border-radius: 50%;
            left: 60px;
            top: 35px;
            transform-origin: 45px 100px;
        }

        .p1 { transform: rotate(0deg); }
        .p2 { transform: rotate(60deg); }
        .p3 { transform: rotate(120deg); }
        .p4 { transform: rotate(180deg); }
        .p5 { transform: rotate(240deg); }
        .p6 { transform: rotate(300deg); }

        .centro {
            position: absolute;
            width: 75px;
            height: 75px;
            background: #8a4500;
            border-radius: 50%;
            left: 67px;
            top: 65px;
            z-index: 3;
            box-shadow: inset 0 5px 12px rgba(0,0,0,0.25);
        }

        @keyframes balanceo {
            0%, 100% {
                transform: translateX(-50%) rotate(-2deg);
            }

            50% {
                transform: translateX(-50%) rotate(2deg);
            }
        }

        /* Tallos */
        .tallo {
            position: absolute;
            width: 12px;
            height: 300px;
            background: #20833b;
            bottom: -130px;
            border-radius: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .hoja {
            position: absolute;
            width: 80px;
            height: 30px;
            background: #248c3e;
            border-radius: 100% 0 100% 0;
        }

        .hoja1 {
            left: -65px;
            top: 120px;
            transform: rotate(15deg);
        }

        .hoja2 {
            right: -65px;
            top: 180px;
            transform: rotate(-15deg);
        }

        /* Tierra */
        .tierra {
            position: absolute;
            bottom: -110px;
            left: -5%;
            width: 110%;
            height: 250px;
            background: #0b2c20;
            border-radius: 50% 50% 0 0;
        }

        /* Hojas cayendo */
        .hoja-caida {
            position: absolute;
            color: #d79a3b;
            font-size: 30px;
            animation: caer 7s linear infinite;
        }

        .caida1 {
            left: 15%;
            top: -50px;
        }

        .caida2 {
            right: 20%;
            top: -100px;
            animation-delay: 2s;
        }

        @keyframes caer {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Ajuste para celulares */
        @media (max-width: 600px) {

            .texto h1 {
                font-size: 58px;
            }

            .luna {
                width: 145px;
                height: 145px;
                right: 35px;
                top: 100px;
            }

            .flor-grande {
                transform: translateX(-50%) scale(0.85);
            }

            .flor-izquierda {
                left: -35px;
                transform: scale(0.58);
            }

            .flor-derecha {
                right: -45px;
                transform: scale(0.58);
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="luna"></div>

    <div class="estrella e1">•</div>
    <div class="estrella e2">•</div>
    <div class="estrella e3">•</div>

    <div class="texto">
        <h1>Ola</h1>
        <div class="flor">🌻</div>
    </div>

    <div class="flores">

        <!-- Flor izquierda -->
        <div class="flor-izquierda">
            <div class="tallo"></div>
            <div class="hoja hoja1"></div>

            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

        <!-- Flor central -->
        <div class="flor-grande">
            <div class="tallo"></div>
            <div class="hoja hoja1"></div>
            <div class="hoja hoja2"></div>

            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

        <!-- Flor derecha -->
        <div class="flor-derecha">
            <div class="tallo"></div>
            <div class="hoja hoja2"></div>

            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

    </div>

    <div class="tierra"></div>

    <div class="hoja-caida caida1">🍂</div>
    <div class="hoja-caida caida2">🍂</div>

</div>

</body>
</html>
