<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Amarillas 🌻</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(
        to bottom,
        #17152b 0%,
        #30234c 45%,
        #d77b62 78%,
        #f6c56f 100%
    );
    font-family: Georgia, serif;
}

/* Luna */
.moon {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #fff5c4;
    top: 10%;
    right: 13%;
    box-shadow: 0 0 35px rgba(255, 240, 170, .5);
    animation: moonGlow 4s infinite alternate;
}

@keyframes moonGlow {
    from { box-shadow: 0 0 25px rgba(255,240,170,.3); }
    to   { box-shadow: 0 0 50px rgba(255,240,170,.7); }
}

/* Texto */
.message {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff7d1;
    text-align: center;
    z-index: 20;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
    animation: appear 2s ease;
}

.message h1 {
    font-size: clamp(28px, 5vw, 55px);
    letter-spacing: 3px;
}

.message p {
    margin-top: 8px;
    font-size: 18px;
    opacity: .9;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translate(-50%, -20px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

/* Suelo */
.ground {
    position: absolute;
    bottom: -30px;
    width: 100%;
    height: 130px;
    background: #142c20;
    border-radius: 50% 50% 0 0;
}

/* Jardín */
.garden {
    position: absolute;
    bottom: 65px;
    left: 50%;
    width: 600px;
    height: 500px;
    transform: translateX(-50%);
}

/* Tallo */
.stem {
    position: absolute;
    bottom: 0;
    width: 7px;
    height: 330px;
    background: linear-gradient(to right, #245c32, #4c913f, #245c32);
    border-radius: 10px;
    transform-origin: bottom;
    animation: sway 4s ease-in-out infinite;
}

@keyframes sway {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(3deg); }
}

/* Posiciones */
.flower:nth-child(1) { left: 48%; }
.flower:nth-child(2) { left: 28%; transform: scale(.75); }
.flower:nth-child(3) { left: 67%; transform: scale(.8); }
.flower:nth-child(4) { left: 13%; transform: scale(.55); }
.flower:nth-child(5) { left: 83%; transform: scale(.6); }

/* Flores */
.flower {
    position: absolute;
    bottom: 0;
    width: 130px;
    height: 400px;
    transform-origin: bottom center;
}

/* Cabeza */
.head {
    position: absolute;
    top: 20px;
    left: 50%;
    width: 105px;
    height: 105px;
    transform: translateX(-50%);
    animation: flowerMove 4s ease-in-out infinite;
}

@keyframes flowerMove {
    0%,100% { transform: translateX(-50%) rotate(-3deg); }
    50% { transform: translateX(-50%) rotate(4deg); }
}

/* Pétalos */
.petal {
    position: absolute;
    width: 48px;
    height: 70px;
    background: linear-gradient(135deg, #fff04a, #f4b900);
    border-radius: 50% 50% 45% 45%;
    left: 50%;
    top: 50%;
    transform-origin: 50% 85%;
    box-shadow: 0 0 8px rgba(255,210,0,.3);
}

.petal:nth-child(1)  { transform: translate(-50%,-50%) rotate(0deg) translateY(-35px); }
.petal:nth-child(2)  { transform: translate(-50%,-50%) rotate(45deg) translateY(-35px); }
.petal:nth-child(3)  { transform: translate(-50%,-50%) rotate(90deg) translateY(-35px); }
.petal:nth-child(4)  { transform: translate(-50%,-50%) rotate(135deg) translateY(-35px); }
.petal:nth-child(5)  { transform: translate(-50%,-50%) rotate(180deg) translateY(-35px); }
.petal:nth-child(6)  { transform: translate(-50%,-50%) rotate(225deg) translateY(-35px); }
.petal:nth-child(7)  { transform: translate(-50%,-50%) rotate(270deg) translateY(-35px); }
.petal:nth-child(8)  { transform: translate(-50%,-50%) rotate(315deg) translateY(-35px); }

/* Centro */
.center {
    position: absolute;
    width: 43px;
    height: 43px;
    background: radial-gradient(circle, #8a4300, #4b2200);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    box-shadow: 0 0 12px rgba(70,30,0,.5);
}

/* Hojas */
.leaf {
    position: absolute;
    width: 75px;
    height: 35px;
    background: linear-gradient(135deg, #65a84d, #1e572d);
    border-radius: 100% 0 100% 0;
}

.leaf.left {
    left: -65px;
    bottom: 150px;
    transform: rotate(25deg);
}

.leaf.right {
    right: -65px;
    bottom: 220px;
    transform: scaleX(-1) rotate(25deg);
}

/* Pasto */
.grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 80px;
}

.grass span {
    position: absolute;
    bottom: 0;
    width: 3px;
    height: 35px;
    background: #39733a;
    transform-origin: bottom;
    animation: grass 2s infinite alternate;
}

@keyframes grass {
    from { transform: rotate(-8deg); }
    to { transform: rotate(8deg); }
}

/* Pétalos flotando */
.floating-petal {
    position: absolute;
    width: 13px;
    height: 22px;
    background: #ffd52e;
    border-radius: 100% 0 100% 0;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) translateX(100px) rotate(500deg);
        opacity: 0;
    }
}

/* Estrellas */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.6); }
    to { opacity: 1; transform: scale(1.5); }
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="message">
    <h1>Flores amarillas 🌻</h1>
    <p>Para iluminar un poquito tu día</p>
</div>

<div class="garden">

    <!-- Flor principal -->
    <div class="flower" style="left:40%;">
        <div class="stem" style="height:330px;"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="head">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>
    </div>

    <!-- Flor izquierda -->
    <div class="flower" style="left:20%; transform:scale(.75);">
        <div class="stem" style="height:270px;"></div>
        <div class="leaf left"></div>

        <div class="head">
            <div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div>
            <div class="center"></div>
        </div>
    </div>

    <!-- Flor derecha -->
    <div class="flower" style="left:65%; transform:scale(.8);">
        <div class="stem" style="height:285px;"></div>
        <div class="leaf right"></div>

        <div class="head">
            <div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div>
            <div class="center"></div>
        </div>
    </div>

</div>

<div class="ground"></div>

<!-- Pétalos flotando -->
<div class="floating-petal" style="left:10%; animation-duration:8s;"></div>
<div class="floating-petal" style="left:25%; animation-duration:11s; animation-delay:2s;"></div>
<div class="floating-petal" style="left:48%; animation-duration:9s; animation-delay:1s;"></div>
<div class="floating-petal" style="left:70%; animation-duration:12s; animation-delay:4s;"></div>
<div class="floating-petal" style="left:90%; animation-duration:10s; animation-delay:3s;"></div>

<!-- Estrellas -->
<div class="star" style="top:15%;left:15%;"></div>
<div class="star" style="top:25%;left:30%;animation-delay:.5s;"></div>
<div class="star" style="top:12%;left:60%;animation-delay:1s;"></div>
<div class="star" style="top:35%;left:80%;animation-delay:.8s;"></div>
<div class="star" style="top:20%;left:90%;animation-delay:1.4s;"></div>

</body>
</html>
<!-- Flores amarillas -->
